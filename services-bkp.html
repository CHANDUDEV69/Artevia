<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background: #fff;
        padding: 3rem;
    }
    .container{
        background: #f1f1f1;
        padding: 0.3rem;
        border-radius: 0.6rem;
    }
    .primaryBox{
        width: max-content;
        display: flex;
        gap: 1rem;
        padding: 0.6rem;
    }
    .level{
        background: #fff;
        padding: 0.6rem;
        border-radius: 0.3rem;
        color: oklch(0.3 0% 0);
        font-size: 0.9rem;
    }
    .level .title{
        font-weight: bold;
        margin-bottom: 0.3rem;
    }
    .level1{
        box-shadow: inset 0px 1px 2px #ffffff30,
        0px 1px 2px #00000030,
        0px 2px 4px #6b020215;
    }
    .level2{
        box-shadow: inset 0px 1px 2px #ffffff50,
        0px 2px 4px #00000030,
        0px 4px 8px #6b020215;
    }
    .level3{
        box-shadow: inset 0px 1px 2px #ffffff70,
        0px 4px 6px #00000030,
        0px 8px 10px #6b020215;
    }
</style>
<body>
    <main>
        <h1>Depth</h1>
        <div class="container">
            <div class="primaryBox">
                <div class="level level0">
                    <div class="title">Level 0</div>
                    <div>No shadow</div>
                </div>

                <div class="level level1">
                    <div class="title">Level 1</div>
                    <div>Small shadow</div>
                </div>

                <div class="level level2">
                    <div class="title">Level 2</div>
                    <div>Medium shadow</div>
                </div>

                <div class="level level3">
                    <div class="title">Level 3</div>
                    <div>Large shadow</div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
